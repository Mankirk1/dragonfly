# gitleaks configuration: the default rules plus project-specific ones.
title = "Dragonfly gitleaks config"

[extend]
useDefault = true

[[rules]]
id = "public-ipv4-address"
description = "Hardcoded IPv4 address outside documentation, private and loopback ranges"
regex = '''\b(?:(?:25[0-5]|2[0-4]\d|1?\d?\d)\.){3}(?:25[0-5]|2[0-4]\d|1?\d?\d)\b'''
keywords = ["."]
[[rules.allowlists]]
regexes = [
  '''\b(?:127|10)\.\d{1,3}\.\d{1,3}\.\d{1,3}\b''',
  '''\b192\.168\.\d{1,3}\.\d{1,3}\b''',
  '''\b172\.(?:1[6-9]|2\d|3[01])\.\d{1,3}\.\d{1,3}\b''',
  '''\b192\.0\.2\.\d{1,3}\b''',
  '''\b198\.51\.100\.\d{1,3}\b''',
  '''\b203\.0\.113\.\d{1,3}\b''',
  '''\b0\.0\.0\.0\b''',
]

[[rules]]
id = "personal-email-address"
description = "Email address that isn't a GitHub noreply or example address"
regex = '''[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}'''
keywords = ["@"]
[[rules.allowlists]]
regexes = [
  '''@users\.noreply\.github\.com''',
  '''@example\.(?:com|org|net)''',
  '''noreply@''',
]

[[rules]]
id = "precise-coordinates"
description = "Latitude/longitude pair with high precision (possible real site location)"
regex = '''-?\d{1,2}\.\d{4,}\s*,\s*-?\d{1,3}\.\d{4,}'''
keywords = [","]

[allowlist]
paths = ['''LICENSE''', '''NOTICE''']
