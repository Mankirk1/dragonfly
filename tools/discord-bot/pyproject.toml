[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "dragonfly-taskbot"
version = "0.1.0"
description = "Discord bot that hands out the Dragonfly team's weekly tasks from a Google Sheet"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "discord.py>=2.4,<3",
  "gspread>=6.1,<7",
  "google-auth>=2.22,<3",
  "requests>=2.31,<3",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
dragonfly-taskbot = "taskbot.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["taskbot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
