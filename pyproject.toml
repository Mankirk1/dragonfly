[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "dragonfly-radar"
version = "0.1.0.dev0"
description = "Open-source Doppler radar tracking system"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [{ name = "The Dragonfly Authors" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]
dependencies = ["numpy>=1.26", "scipy>=1.11"]

[project.optional-dependencies]
dev = ["scikit-learn>=1.4", "pytest>=8", "pytest-cov>=5", "hypothesis>=6.100", "mypy>=1.10", "ruff>=0.6", "pre-commit>=3.7"]
hardware = ["pyserial>=3.5"]
ml = ["scikit-learn>=1.4"]

[project.urls]
Repository = "https://github.com/Mankirk1/dragonfly"
Issues = "https://github.com/Mankirk1/dragonfly/issues"

[project.scripts]
dragonfly-log = "dragonfly.io.logger:main"
dragonfly-sim = "dragonfly.sim.cli:main"
dragonfly-classify-sim = "dragonfly.classify.report:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dragonfly"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["dragonfly"]

[tool.coverage.report]
fail_under = 95
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "N"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src"]

[[tool.mypy.overrides]]
module = ["serial", "scipy", "scipy.*", "sklearn", "sklearn.*"]
ignore_missing_imports = true
