name: Bug report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Security problem?** Don't file it here. Follow SECURITY.md instead.
        Please don't paste credentials, IP addresses, locations or real radar data.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. ...\n2. ..."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Dragonfly version or commit
  - type: input
    id: environment
    attributes:
      label: OS and Python version
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove any secrets, addresses or personal details first.
      render: shell
